name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the next release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+$")) | sub("^v"; "") | tonumber] | max // 0')"
          next="v$((latest + 1))"
          gh release create "$next" --target "$GITHUB_SHA" --generate-notes --title "$next"
